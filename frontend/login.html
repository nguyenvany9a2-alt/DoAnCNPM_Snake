<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - DrugSafe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="container header-content">
        <div class="logo">Drug<span>Safe</span></div>

        <nav class="nav">
            <a href="index.html">Trang chủ</a>
            <a href="check.html">Kiểm tra</a>
            <a href="register.html">Đăng ký</a>
        </nav>
    </div>
</header>

<section class="section">
    <div class="container">
        <div class="form-box">
            <div class="card-icon" style="margin: 0 auto 16px;">🔐</div>
            <h2>Đăng nhập hệ thống</h2>

            <div id="loginMessage" class="message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="Nhập email của bạn"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="Nhập mật khẩu"
                    >
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;">
                    Đăng nhập
                </button>
            </form>

            <p style="text-align:center; margin-top:18px; color:#6b7280;">
                Chưa có tài khoản?
                <a href="register.html" style="color:#0f766e; font-weight:700;">
                    Đăng ký ngay
                </a>
            </p>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p>© 2026 DrugSafe - Đồ án Công nghệ phần mềm</p>
    </div>
</footer>

<script src="js/api.js"></script>
<script src="js/login.js"></script>

</body>
</html>
