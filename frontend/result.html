<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả kiểm tra - DrugSafe</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .result-layout {
            display: grid;
            gap: 20px;
        }

        .result-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(15, 118, 110, 0.08);
            border: 1px solid #e5e7eb;
        }

        .result-card h3 {
            margin-bottom: 14px;
            color: #0f766e;
        }

        .result-card p {
            margin: 8px 0;
            line-height: 1.6;
        }

        .level-low,
        .level-medium,
        .level-high {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 14px;
        }

        .level-low {
            background: #dcfce7;
            color: #166534;
        }

        .level-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .level-high {
            background: #fee2e2;
            color: #991b1b;
        }

        .recommendation-section {
            margin-top: 20px;
        }

        .recommendation-list {
            display: grid;
            gap: 14px;
            margin-top: 12px;
        }

        .recommendation-card {
            background: #f0fdfa;
            border: 1px solid #99f6e4;
            border-left: 6px solid #0f766e;
            border-radius: 16px;
            padding: 18px;
        }

        .recommendation-card h4 {
            margin-bottom: 10px;
            color: #0f766e;
            font-size: 20px;
        }

        .safe-advice {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-left: 6px solid #2563eb;
            border-radius: 16px;
            padding: 18px;
            margin-top: 14px;
        }

        .safe-advice ul {
            margin-left: 20px;
            line-height: 1.8;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .action-group {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="container header-content">
        <div class="logo">Drug<span>Safe</span></div>

        <nav class="nav">
            <a href="index.html">Trang chủ</a>
            <a href="check.html">Kiểm tra lại</a>
            <a href="history.html">Lịch sử</a>
            <a href="login.html">Đăng nhập</a>
        </nav>
    </div>
</header>

<section class="section">
    <div class="container">
        <h2 class="section-title">Kết quả kiểm tra</h2>
        <p class="section-desc">
            Dưới đây là kết quả phân tích dựa trên dữ liệu thuốc, bệnh nền và tương tác thuốc trong hệ thống.
        </p>

        <div id="resultBox" class="result-layout"></div>

        <div class="action-group">
            <a href="check.html" class="btn btn-primary">Quay lại kiểm tra</a>
            <a href="history.html" class="btn btn-light">Xem lịch sử</a>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p>© 2026 DrugSafe - Đồ án Công nghệ phần mềm</p>
    </div>
</footer>

<script src="js/api.js"></script>
<script src="js/result.js"></script>
<script src="js/auth-ui.js"></script>
</body>
</html>
